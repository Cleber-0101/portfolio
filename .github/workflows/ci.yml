name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint@1 "index.html"

      - name: Checar se todo arquivo local citado no HTML existe
        run: |
          set -e
          missing=0
          for f in $(grep -oE '(href|src)="assets/[^"]+"' index.html | sed -E 's/^(href|src)="//; s/"$//' | sort -u); do
            if [ -f "$f" ]; then echo "ok    $f"; else echo "FALTA $f"; missing=1; fi
          done
          exit $missing
