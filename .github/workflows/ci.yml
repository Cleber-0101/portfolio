name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint@1 "index.html"

      - name: Checar arquivos essenciais
        run: |
          set -e
          for f in index.html style.css script.js "Cleber - CV.pdf"; do
            test -f "$f" || { echo "Faltando: $f"; exit 1; }
          done
          echo "OK"
